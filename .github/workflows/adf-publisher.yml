name: ADF Publisher

on:
  schedule:
    - cron: "11 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "ops/adf_publisher/**"
      - ".github/workflows/adf-publisher.yml"

permissions:
  contents: write

concurrency:
  group: adf-publisher
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate queue
        run: python ops/adf_publisher/publish_due.py --check

      - name: Apply due releases
        run: python ops/adf_publisher/publish_due.py

      - name: Detect release changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Stage governed release branch
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          BRANCH="automation/adf-release"
          git config user.name "ADF Publisher"
          git config user.email "actions@users.noreply.github.com"

          git switch -C "$BRANCH"
          git add insights sitemap.xml ops/adf_publisher/QUEUE.json
          git commit -m "Release scheduled ADF Insights"
          git push --force-with-lease origin "$BRANCH"

          echo "Staged governed release on $BRANCH."
          echo "Repository policy blocks GitHub Actions from creating pull requests."
          echo "Media Command is the authorized promotion executor for PR creation, merge, and Pages verification."
